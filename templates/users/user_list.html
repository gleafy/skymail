{% extends "base.html" %}
{% block content %}
<h2>Список пользователей</h2>
<table>
    <thead>
        <tr>
            <th>Email</th>
            <th>Имя пользователя</th>
            <th>Активен</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.email }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.is_active|yesno:"Да,Нет" }}</td>
            <td>
                <form action="{% url 'toggle_user_active' user.pk %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">{{ user.is_active|yesno:"Заблокировать,Разблокировать" }}</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
