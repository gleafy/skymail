{% extends "base.html" %}
{% load user_tags %}
{% block content %}
<h2>Сообщения</h2>
<a href="{% url 'mailings:messages_add' %}">Добавить</a>
<ul>
{% for obj in object_list %}
<li>{{ obj.subject }}
    {% if obj.owner == user %}
    <a href="{% url 'mailings:messages_edit' obj.pk %}">Изменить</a>
    <a href="{% url 'mailings:messages_delete' obj.pk %}">Удалить</a>
    {% endif %}
</li>
{% endfor %}
</ul>
{% endblock %}
